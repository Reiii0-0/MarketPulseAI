version: 2

sources:
  - name: raw
    schema: raw
    description: "Append-only raw tables written by Kafka consumers."
    tables:
      - name: market_ticks
        description: "Raw tick-level price and volume data."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: ticker
            tests: [not_null]
          - name: event_timestamp
            tests: [not_null]
          - name: price
            tests: [not_null]
          - name: volume
            tests: [not_null]
      - name: sentiment_events
        description: "Pre-computed NLP sentiment events."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: ticker
            tests: [not_null]
          - name: event_timestamp
            tests: [not_null]
          - name: sentiment_score
            tests: [not_null]
          - name: sentiment_label
            tests:
              - accepted_values:
                  values: ['POSITIVE', 'NEGATIVE', 'NEUTRAL']
      - name: predictions
        description: "Predictions generated by the API."
        columns:
          - name: request_id
            tests: [unique, not_null]
