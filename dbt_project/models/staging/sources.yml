version: 2

sources:
  - name: raw
    schema: raw
    description: "Append-only raw tables written by Kafka consumers."
    tables:
      - name: market_ticks
        description: "Raw tick-level price and volume data."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: dataset_id
            tests: [not_null]
          - name: source_event_id
            tests: [not_null]
          - name: ticker
            tests: [not_null]
          - name: event_at
            tests: [not_null]
          - name: available_at
            tests: [not_null]
          - name: price
            tests: [not_null]
          - name: volume
            tests: [not_null]

      - name: market_bars
        description: "Canonical 1-minute OHLCV bars ingested from historical/bar feeds."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: dataset_id
            tests: [not_null]
          - name: source_event_id
            tests: [not_null]
          - name: ticker
            tests: [not_null]
          - name: bar_start
            tests: [not_null]
          - name: bar_end
            tests: [not_null]
          - name: available_at
            tests: [not_null]
          - name: close
            tests: [not_null]

      - name: sentiment_events
        description: "Pre-computed NLP sentiment events."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: dataset_id
            tests: [not_null]
          - name: source_event_id
            tests: [not_null]
          - name: ticker
            tests: [not_null]
          - name: available_at
            tests: [not_null]
          - name: sentiment_score
            tests: [not_null]
          - name: sentiment_label
            tests:
              - accepted_values:
                  values: ['POSITIVE', 'NEGATIVE', 'NEUTRAL']

      - name: ingestion_runs
        description: "Replay and live ingestion run metadata."
        columns:
          - name: run_id
            tests: [unique, not_null]

      - name: run_delivery_progress
        description: "Per-run, per-topic, per-partition delivery progress barriers."
        columns:
          - name: run_id
            tests: [not_null]

      - name: predictions
        description: "Predictions generated and persisted by prediction pipeline."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: request_id
            tests: [unique, not_null]
          - name: model_version
            tests: [not_null]

  - name: marts
    schema: marts
    description: "Immutable finalized bars, late arrival corrections, and feature snapshots."
    tables:
      - name: final_bars
        description: "Immutable finalized 1-minute UTC OHLCV bars."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: contract_id
            tests: [not_null]
          - name: dataset_id
            tests: [not_null]
          - name: ticker
            tests: [not_null]
          - name: bar_end
            tests: [not_null]

      - name: late_bar_corrections
        description: "Audit log of late events arriving after finalization grace cutoff."
        columns:
          - name: id
            tests: [unique, not_null]

      - name: feature_snapshots
        description: "Immutable feature snapshots frozen with contract_version and feature_hash."
        columns:
          - name: id
            tests: [unique, not_null]
          - name: feature_hash
            tests: [not_null]

      - name: realized_outcomes_v
      - name: model_predictions
        description: "Immutable write-once predictions bound to snapshot hash and bundle manifest."
        columns:
          - name: prediction_id
            tests: [unique, not_null]
          - name: contract_id
            tests: [not_null]
          - name: model_version
            tests: [not_null]

      - name: prediction_worker_state
        description: "Single-worker per-run checkpoint and lease state."
        columns:
          - name: run_id
            tests: [unique, not_null]
