version: 2

models:
  - name: stg_market_ticks
    description: "Staging model for market ticks."
    columns:
      - name: ticker
        tests: [not_null]
      - name: event_timestamp
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: volume
        tests: [not_null]

  - name: stg_sentiment_events
    description: "Staging model for sentiment events."
    columns:
      - name: sentiment_label
        tests:
          - accepted_values:
              values: ['POSITIVE', 'NEGATIVE', 'NEUTRAL']

  - name: int_ohlcv_5min
    description: "5-minute OHLCV aggregation."
    columns:
      - name: open
        tests: [not_null]
      - name: high
        tests: [not_null]
      - name: low
        tests: [not_null]
      - name: close
        tests: [not_null]
      - name: volume
        tests: [not_null]

  - name: marts.stock_features
    description: "Final ML-ready feature table."
    columns:
      - name: ticker
        tests: [not_null]
      - name: window_start
        tests: [not_null]
      - name: target_direction
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
    tests:
      - unique:
          column_name: "(ticker || '-' || window_start)"
