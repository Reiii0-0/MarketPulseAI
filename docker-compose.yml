networks:
  internal_net:
    driver: bridge
    internal: true
  edge_net:
    driver: bridge

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    networks:
      - internal_net
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  init-kafka:
    image: apache/kafka:3.7.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - internal_net
    volumes:
      - ./scripts/create_topics.sh:/scripts/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]

  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal_net
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./scripts/migrations:/migrations:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    command: ["python", "producer/replay_producer.py"]
    env_file: .env
    environment:
      REPLAY_MANIFEST_PATH: ${REPLAY_MANIFEST_PATH:-/app/data/manifests/fixture_smoke_v1.json}
      REPLAY_RUN_ID: ${REPLAY_RUN_ID:-replay-smoke-1}
      REPLAY_SPEED_MULTIPLIER: ${REPLAY_SPEED_MULTIPLIER:-1.0}
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    volumes:
      - ./data:/app/data:ro
      - ./producer:/app/producer:ro
      - ./pipeline:/app/pipeline:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'replay_producer.py' in Path(\"/proc/1/cmdline\").read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: "no"

  live-producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    profiles: ["live"]
    command: ["python", "producer/live_producer.py"]
    env_file: .env
    environment:
      LIVE_MODE: ${LIVE_MODE:-real}
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - internal_net
      - edge_net
    volumes:
      - ./data:/app/data:ro
      - ./producer:/app/producer:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'live_producer.py' in Path(\"/proc/1/cmdline\").read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  tick-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    command: python consumer/tick_consumer.py
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'tick_consumer.py' in Path(\"/proc/1/cmdline\").read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sentiment-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    command: python consumer/sentiment_consumer.py
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'sentiment_consumer.py' in Path(\"/proc/1/cmdline\").read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  bar-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    command: python consumer/bar_consumer.py
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'bar_consumer.py' in Path(\"/proc/1/cmdline\").read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dbt-runner:
    build:
      context: .
      dockerfile: dbt_project/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    volumes:
      - ./dbt_project:/usr/app/dbt_project
    healthcheck:
      test: ["CMD", "dbt", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api:
    image: ${MARKETPULSE_API_IMAGE:-marketpulseai-api:latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    env_file: .env
    environment:
      API_READONLY_DEMO: ${API_READONLY_DEMO:-false}
      API_MAX_REQUESTS_PER_MINUTE: ${API_MAX_REQUESTS_PER_MINUTE:-120}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
      - edge_net
    volumes:
      - ./model/artefacts:/app/model/artefacts:ro
      - ./reports:/app/reports:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prediction-worker:
    image: ${MARKETPULSE_WORKER_IMAGE:-${MARKETPULSE_API_IMAGE:-marketpulseai-api:latest}}
    command: ["python", "-m", "pipeline.worker", "--loop", "--interval-seconds", "5"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    volumes:
      - ./model/artefacts:/app/model/artefacts:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'pipeline.worker' in Path(\"/proc/1/cmdline\").read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal_net
      - edge_net
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
