services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: marketpulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  init-kafka:
    image: apache/kafka:3.7.0
    container_name: marketpulse-init-kafka
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_topics.sh:/scripts/create_topics.sh
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]

  postgres:
    image: postgres:15-alpine
    container_name: marketpulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: marketpulse-producer
    command: ["python", "producer/live_producer.py"]
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./producer:/app/producer
    healthcheck:
      test: ["CMD", "pgrep", "-f", "live_producer.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  tick-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: marketpulse-tick-consumer
    command: python consumer/tick_consumer.py
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "tick_consumer.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sentiment-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: marketpulse-sentiment-consumer
    command: python consumer/sentiment_consumer.py
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "sentiment_consumer.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dbt-runner:
    build:
      context: .
      dockerfile: dbt_project/Dockerfile
    container_name: marketpulse-dbt
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dbt_project:/usr/app/dbt_project
    healthcheck:
      test: ["CMD", "dbt", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: marketpulse-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./model:/app/model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: marketpulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
