apiVersion: 1

datasources:
  - name: MarketPulse-Postgres
    type: postgres
    uid: marketpulse_postgres_db
    url: postgres:5432
    database: $__env{POSTGRES_DB}
    user: $__env{POSTGRES_USER}
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timesbin: false
      searchPath: 'marts,staging,intermediate,raw,public'
    isDefault: true
    editable: false
